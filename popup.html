<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #202024;
      --accent-color: #f39c12;
      --text-main: #e1e1e6;
      --text-muted: #8d8d99;
    }

    body {
      width: 290px;
      padding: 16px;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-color);
    }

    /* Abas de Navegação */
    .tabs {
      display: flex;
      border-bottom: 1px solid #29292e;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom-color: var(--accent-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards e Controles */
    .site-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      border: 1px solid #29292e;
    }

    .site-domain {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      word-break: break-all;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }

    /* Modern Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #323238;
      transition: .3s;
      border-radius: 20px;
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle { background-color: var(--accent-color); }
    input:checked + .slider-toggle:before { transform: translateX(20px); }

    /* Controles de Sliders */
    .control-block { margin-bottom: 12px; }

    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .value-badge { color: var(--accent-color); font-weight: 600; }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: #323238;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
    }

    /* Lista de Exceções */
    .site-list {
      max-height: 180px;
      overflow-y: auto;
    }

    .site-item {
      display: flex;
      align-items: center;
      background-color: var(--card-bg);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-main);
    }

    .empty-msg {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 15px 0;
    }

    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #29292e;
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Dark Mode Custom</h2>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-general">GERAL</button>
    <button class="tab-btn" data-tab="tab-list">SITES ATIVOS</button>
  </div>

  <!-- Aba 1: Geral -->
  <div id="tab-general" class="tab-content active">
    <div class="site-card">
      <div class="site-domain" id="siteDomain">carregando...</div>
      <div class="toggle-row">
        <span class="toggle-label">Ativar neste site</span>
        <label class="switch">
          <input type="checkbox" id="siteToggle">
          <span class="slider-toggle"></span>
        </label>
      </div>
      <div class="toggle-row" style="margin-top: 10px;">
        <span class="toggle-label" style="font-size: 12px;">Modo Inteligente (Preservar Mídia)</span>
        <label class="switch">
          <input type="checkbox" id="smartMediaToggle" checked>
          <span class="slider-toggle"></span>
        </label>
      </div>
    </div>

    <div class="control-block">
      <div class="control-header">
        <span>Brilho</span>
        <span class="value-badge" id="brightnessVal">100%</span>
      </div>
      <input type="range" id="brightness" min="20" max="150" value="100">
    </div>

    <div class="control-block">
      <div class="control-header">
        <span>Contraste</span>
        <span class="value-badge" id="contrastVal">100%</span>
      </div>
      <input type="range" id="contrast" min="50" max="150" value="100">
    </div>

    <div class="control-block">
      <div class="control-header">
        <span>Night Shift (Luz Amarela)</span>
        <span class="value-badge" id="warmthVal">0%</span>
      </div>
      <input type="range" id="warmth" min="0" max="100" value="0">
    </div>
  </div>

  <!-- Aba 2: Lista de Exceções -->
  <div id="tab-list" class="tab-content">
    <div class="site-list" id="siteList">
      <!-- Gerado via JS -->
    </div>
  </div>

  <div class="footer">
    developed by A.R.Silva
  </div>

  <script src="popup.js"></script>
</body>
</html>
