<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #202024;
      --accent-color: #f39c12;
      --text-main: #e1e1e6;
      --text-muted: #8d8d99;
    }

    body {
      width: 280px;
      padding: 18px;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 0.5px;
    }

    .site-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #29292e;
    }

    .site-domain {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      word-break: break-all;
      text-transform: lowercase;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }

    /* Modern Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #323238;
      transition: .3s;
      border-radius: 22px;
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle {
      background-color: var(--accent-color);
    }

    input:checked + .slider-toggle:before {
      transform: translateX(20px);
    }

    /* Sliders styling */
    .control-block {
      margin-bottom: 14px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .value-badge {
      color: var(--accent-color);
      font-weight: 600;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #323238;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Footer */
    .footer {
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px solid #29292e;
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Dark Mode Custom</h2>
  </div>

  <div class="site-card">
    <div class="site-domain" id="siteDomain">carregando site...</div>
    <div class="toggle-row">
      <span class="toggle-label">Ativar neste site</span>
      <label class="switch">
        <input type="checkbox" id="siteToggle">
        <span class="slider-toggle"></span>
      </label>
    </div>
  </div>

  <div class="control-block">
    <div class="control-header">
      <span>Brilho</span>
      <span class="value-badge" id="brightnessVal">100%</span>
    </div>
    <input type="range" id="brightness" min="20" max="150" value="100">
  </div>

  <div class="control-block">
    <div class="control-header">
      <span>Contraste</span>
      <span class="value-badge" id="contrastVal">100%</span>
    </div>
    <input type="range" id="contrast" min="50" max="150" value="100">
  </div>

  <div class="footer">
    developed by A.R.Silva
  </div>

  <script src="popup.js"></script>
</body>
</html>
